name: Scheduled market scan

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forex-signal-scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FOREX_SIGNAL_DATABASE_URL: ${{ secrets.FOREX_SIGNAL_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Require shared persistent database
        run: |
          if [ -z "$FOREX_SIGNAL_DATABASE_URL" ]; then
            echo "::error::Add FOREX_SIGNAL_DATABASE_URL as a GitHub Actions repository secret before running scheduled scans."
            exit 1
          fi
      - name: Run one scheduled market scan
        run: python monitor.py --once
